<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siêu Nhí Cờ Vua - Đổi Quân Có Lợi Thế</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --board-size: min(62vh, 440px);
        }
        body.nav-collapsed {
            --board-size: min(70vh, 490px);
        }
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 50%, #ffedd5 100%);
            user-select: none;
            overflow: hidden;
        }
        h1, h2, h3, .font-fun {
            font-family: 'Fredoka', sans-serif;
        }
        .chess-board-grid {
            width: var(--board-size);
            height: var(--board-size);
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 5px solid #7c2d12;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(124, 45, 18, 0.25);
            position: relative;
            overflow: hidden;
            transition: width 0.25s ease, height 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .board-glow-green {
            border-color: #22c55e !important;
            box-shadow: 0 0 20px 6px rgba(34, 197, 94, 0.85), 0 0 42px 12px rgba(34, 197, 94, 0.45) !important;
            animation: pulseGlowGreen 1.4s infinite alternate;
        }
        .board-glow-red {
            border-color: #ef4444 !important;
            box-shadow: 0 0 20px 6px rgba(239, 68, 68, 0.85), 0 0 42px 12px rgba(239, 68, 68, 0.45) !important;
            animation: shake 0.4s ease-in-out, pulseGlowRed 1.2s infinite alternate;
        }
        @keyframes pulseGlowGreen {
            0% { box-shadow: 0 0 16px 4px rgba(34, 197, 94, 0.75), 0 0 32px 8px rgba(34, 197, 94, 0.35); }
            100% { box-shadow: 0 0 26px 8px rgba(34, 197, 94, 0.95), 0 0 48px 14px rgba(34, 197, 94, 0.55); }
        }
        @keyframes pulseGlowRed {
            0% { box-shadow: 0 0 16px 4px rgba(239, 68, 68, 0.75), 0 0 32px 8px rgba(239, 68, 68, 0.35); }
            100% { box-shadow: 0 0 26px 8px rgba(239, 68, 68, 0.95), 0 0 48px 14px rgba(239, 68, 68, 0.55); }
        }
        .sq-light { background-color: #f8dcc0; }
        .sq-dark { background-color: #d48c55; }
        .sq-selected {
            background-color: #fde047 !important;
            box-shadow: inset 0 0 0 3px #ca8a04;
        }
        .sq-last-move {
            background-color: rgba(163, 230, 53, 0.55) !important;
        }
        .sq-hint::after {
            content: '';
            position: absolute;
            width: 34%;
            height: 34%;
            background-color: rgba(22, 163, 74, 0.85);
            border: 2px solid #14532d;
            border-radius: 50%;
            pointer-events: none;
            animation: pulseDot 1.3s infinite;
        }
        .sq-capture-hint {
            box-shadow: inset 0 0 0 3px #dc2626;
            background-color: rgba(254, 202, 202, 0.72) !important;
        }
        @keyframes pulseDot {
            0%, 100% { transform: scale(0.9); }
            50% { transform: scale(1.15); }
        }
        .piece-svg-wrap {
            width: 86%;
            height: 86%;
            transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.22));
        }
        .piece-svg-wrap:hover {
            transform: scale(1.12);
        }
        .bounce-in {
            animation: bounceIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .shake {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-6px); }
        }
        .balance-beam {
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center center;
        }
        .btn-3d {
            transition: all 0.12s ease;
            box-shadow: 0 3px 0 rgba(0,0,0,0.2);
        }
        .btn-3d:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.2);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .mystery-tile.locked svg {
            filter: grayscale(100%) brightness(62%) contrast(85%);
        }
        .mystery-tile.unlocked {
            animation: tileUnlockPop 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes tileUnlockPop {
            0% { transform: scale(0.55) rotateY(90deg); filter: brightness(1.8); }
            60% { transform: scale(1.08) rotateY(0deg); filter: brightness(1.2); }
            100% { transform: scale(1) rotateY(0deg); filter: brightness(1); }
        }
    </style>
</head>

        // 1. HỆ THỐNG ÂM THANH WEB AUDIO API (TỔNG HỢP TRỰC TIẾP)

        const SoundFX = {
            enabled: true,
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            tone(freq, type = 'sine', duration = 0.14, delay = 0, vol = 0.18) {
                if (!this.enabled) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + delay);
                    osc.stop(this.ctx.currentTime + delay + duration);
                } catch (e) {}
            },
            click() { this.tone(600, 'triangle', 0.07, 0, 0.14); },
            move() { this.tone(380, 'sine', 0.09, 0, 0.18); },
            capture() {
                this.tone(310, 'square', 0.08, 0, 0.16);
                this.tone(490, 'square', 0.12, 0.06, 0.18);
            },
            unlock() {
                this.tone(523.25, 'sine', 0.14, 0, 0.2);
                this.tone(659.25, 'sine', 0.14, 0.08, 0.2);
                this.tone(783.99, 'sine', 0.16, 0.16, 0.2);
                this.tone(1046.50, 'triangle', 0.3, 0.24, 0.22);
            },
            victory() {
                const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50];
                const times = [0, 0.11, 0.22, 0.33, 0.5, 0.64];
                notes.forEach((n, i) => this.tone(n, 'triangle', 0.28, times[i], 0.24));
            },
            error() {
                this.tone(210, 'sawtooth', 0.15, 0, 0.14);
                this.tone(175, 'sawtooth', 0.22, 0.13, 0.14);
            },
            tick() { this.tone(850, 'sine', 0.06, 0, 0.12); }

        const BoardArrow = ({ arrow }) => {
            if (!arrow) return null;
            const { fromR, fromC, toR, toC, color } = arrow;
            const x1 = fromC * 100 + 50;
            const y1 = fromR * 100 + 50;
            const x2 = toC * 100 + 50;
            const y2 = toR * 100 + 50;
            const angle = Math.atan2(y2 - y1, x2 - x1);
            const headLen = 38;
            const endX = x2 - Math.cos(angle) * 18;
            const endY = y2 - Math.sin(angle) * 18;
            const p1x = endX - headLen * Math.cos(angle - Math.PI / 6);
            const p1y = endY - headLen * Math.sin(angle - Math.PI / 6);
            const p2x = endX - headLen * Math.cos(angle + Math.PI / 6);
            const p2y = endY - headLen * Math.sin(angle + Math.PI / 6);

            return (
                <svg viewBox="0 0 800 800" className="absolute inset-0 w-full h-full pointer-events-none z-20">
                    <circle cx={x1} cy={y1} r="14" fill={color} opacity="0.88" />
                    <line
                        x1={x1} y1={y1}
                        x2={endX - Math.cos(angle) * 14}
                        y2={endY - Math.sin(angle) * 14}
                        stroke={color} strokeWidth="18" strokeLinecap="round" opacity="0.92"
                    />
                    <polygon points={`${endX},${endY} ${p1x},${p1y} ${p2x},${p2y}`} fill={color} />
                </svg>
            );
        };

        function App() {
            const [activeTab, setActiveTab] = useState('puzzles');
            const [navCollapsed, setNavCollapsed] = useState(false);
            const [soundOn, setSoundOn] = useState(true);

            // Đồng bộ class body để co giãn bàn cờ khi thu gọn navbar
            useEffect(() => {

            }, [navCollapsed]);

            const handleToggleSound = () => {
                const next = !soundOn;
                setSoundOn(next);
                SoundFX.enabled = next;
                if (next) SoundFX.click();
            };

            // --- State Tab 1: Bí Kíp Đi Quân ---
            const [moveIdx, setMoveIdx] = useState(0);
            const [movePos, setMovePos] = useState([4, 3]);
            const [stars, setStars] = useState([]);
            const [stepCount, setStepCount] = useState(0);
            const [starChallenge, setStarChallenge] = useState(false);
            const [starMsg, setStarMsg] = useState('Bấm "Rải Sao Mới" hoặc bấm vào chấm xanh lá để đi thử!');

            const selectMoveRule = (idx) => {
                SoundFX.click();
                setMoveIdx(idx);
                setMovePos([...MOVE_RULES[idx].startPos]);
                setStars([]);
                setStepCount(0);
                setStarChallenge(false);
                setStarMsg('Bấm "Rải Sao Mới" hoặc bấm vào chấm xanh lá để đi thử!');
            };

            const getValidDemoMoves = (type, r, c) => {
                const moves = [];
                const ok = (nr, nc) => nr >= 0 && nr < 8 && nc >= 0 && nc < 8;
                if (type === 'R' || type === 'Q') {
                    [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr, dc]) => {
                        for (let s = 1; s < 8; s++) if (ok(r + dr*s, c + dc*s)) moves.push({ r: r + dr*s, c: c + dc*s, capOnly: false });
                    });
                }
                if (type === 'B' || type === 'Q') {
                    [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([dr, dc]) => {
                        for (let s = 1; s < 8; s++) if (ok(r + dr*s, c + dc*s)) moves.push({ r: r + dr*s, c: c + dc*s, capOnly: false });
                    });
                }
                if (type === 'N') {
                    [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]].forEach(([dr, dc]) => {
                        if (ok(r + dr, c + dc)) moves.push({ r: r + dr, c: c + dc, capOnly: false });
                    });
                }
                if (type === 'K') {
                    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
                        if ((dr || dc) && ok(r + dr, c + dc)) moves.push({ r: r + dr, c: c + dc, capOnly: false });
                    }
                }
                if (type === 'P') {
                    if (ok(r - 1, c)) moves.push({ r: r - 1, c: c, capOnly: false });
                    if (r === 6 && ok(r - 2, c)) moves.push({ r: r - 2, c: c, capOnly: false });
                    if (ok(r - 1, c - 1)) moves.push({ r: r - 1, c: c - 1, capOnly: true });
                    if (ok(r - 1, c + 1)) moves.push({ r: r - 1, c: c + 1, capOnly: true });
                }
                return moves;
            };

            const startStars = () => {
                SoundFX.capture();
                const rule = MOVE_RULES[moveIdx];
                const start = [...rule.startPos];
                setMovePos(start);
                setStepCount(0);
                setStarChallenge(true);
                const pool = [];
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        if (r === start[0] && c === start[1]) continue;
                        if (rule.type === 'B' && ((r + c) % 2 !== (start[0] + start[1]) % 2)) continue;
                        if (rule.type === 'P' && (r >= start[0] || Math.abs(c - start[1]) > (start[0] - r))) continue;
                        pool.push({ r, c });
                    }
                }
                pool.sort(() => Math.random() - 0.5);
                const chosen = pool.slice(0, 4);
                setStars(chosen);
                setStarMsg(`Còn ${chosen.length} ngôi sao ⭐ trên bàn cờ!`);
            };

            // --- State Tab 2: Điểm & Cân Công Lý ---
            const [heroIdx, setHeroIdx] = useState(0);
            const [leftPan, setLeftPan] = useState([]);
            const [rightPan, setRightPan] = useState([]);

            // --- State Tab 3: Thử Thách Đổi Quân & Tranh Bí Ẩn 6x4 (23 bài + 1 ô thưởng) ---
            const [puzzleIdx, setPuzzleIdx] = useState(0);
            const [boardState, setBoardState] = useState({ ...PUZZLES[0].pieces });
            const [selectedSq, setSelectedSq] = useState(null);
            const [lastMoveSq, setLastMoveSq] = useState([]);
            const [solved, setSolved] = useState(false);
            const [arrow, setArrow] = useState(null);
            const [feedback, setFeedback] = useState(null);
            const [unlockedTiles, setUnlockedTiles] = useState(Array(23).fill(false));
            const [justUnlocked, setJustUnlocked] = useState(-1);
            const [artKey, setArtKey] = useState('knightCup');
            const [showVictory, setShowVictory] = useState(false);
            const canvasRef = useRef(null);

            const loadPuzzle = (idx) => {
                SoundFX.click();
                setPuzzleIdx(idx);
                setBoardState({ ...PUZZLES[idx].pieces });
                setSelectedSq(null);
                setLastMoveSq([]);
                setSolved(false);
                setArrow(null);
                setFeedback(null);
            };

            const launchFireworks = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                canvas.classList.remove('hidden');
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                const particles = [];
                const colors = ['#f43f5e', '#f59e0b', '#10b981', '#3b82f6', '#a855f7'];
                for (let b = 0; b < 6; b++) {
                    const cx = canvas.width * (0.2 + Math.random() * 0.6);
                    const cy = canvas.height * (0.2 + Math.random() * 0.45);
                    const color = colors[b % colors.length];
                    for (let i = 0; i < 42; i++) {
                        const a = (Math.PI * 2 * i) / 42;
                        const spd = 2 + Math.random() * 5;
                        particles.push({ x: cx, y: cy, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, alpha: 1, color });
                    }
                }
                let f = 0;
                const loop = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(p => {
                        p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.alpha -= 0.014;
                        if (p.alpha > 0) {
                            ctx.globalAlpha = p.alpha;
                            ctx.fillStyle = p.color;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, 4.5, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    });
                    f++;
                    if (f < 85) requestAnimationFrame(loop);
                    else canvas.classList.add('hidden');
                };
                loop();
            };

            const onPuzzleSquareClick = (r, c) => {
                if (solved) return;
                const puzzle = PUZZLES[puzzleIdx];
                const code = boardState[`${r},${c}`];

                if (code && code.startsWith(puzzle.turn)) {
                    SoundFX.click();
                    setSelectedSq([r, c]);
                    if (feedback && !feedback.ok) {
                        setFeedback(null);
                        setArrow(null);
                    }
                    return;
                }

                if (selectedSq) {
                    const [fr, fc] = selectedSq;
                    const isMainTarget = r === puzzle.to[0] && c === puzzle.to[1];
                    const isAltTarget = puzzle.altTo && r === puzzle.altTo[0] && c === puzzle.altTo[1];

                    if (fr === puzzle.from[0] && fc === puzzle.from[1] && (isMainTarget || isAltTarget)) {
                        const nextBoard = { ...boardState };
                        const moving = nextBoard[`${fr},${fc}`];
                        delete nextBoard[`${fr},${fc}`];
                        nextBoard[`${r},${c}`] = moving;
                        setBoardState(nextBoard);
                        setSelectedSq(null);
                        setLastMoveSq([`${fr},${fc}`, `${r},${c}`]);
                        setSolved(true);
                        setArrow({ fromR: fr, fromC: fc, toR: r, toC: c, color: '#15803d' });

                        const wasUnlocked = unlockedTiles[puzzleIdx];

                                                <span className="text-2xl font-black text-amber-700">⇄</span>
                                                <div className="flex gap-1 bg-white px-3 py-1 rounded-xl border border-amber-300 shadow-sm">
                                                    {arenaQuestions[arenaIdx].right.map((t, i) => <div key={i} className="w-8 h-8 sm:w-9 sm:h-9"><ChessPiece type={t} color="b" /></div>)}
                                                </div>
                                            </div>
                                            <h3 className="text-sm sm:text-base font-extrabold text-slate-800 mt-1">{arenaQuestions[arenaIdx].text}</h3>
                                            <h3 className="text-sm sm:text-base font-extrabold text-slate-800">{arenaQuestions[arenaIdx].text}</h3>

                                            <div className="grid grid-cols-3 gap-2.5 mt-2.5">
                                                <button onClick={() => handleArenaChoice('LOI')} className="btn-3d bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold py-2 rounded-xl border-2 border-emerald-700 text-sm sm:text-base">🤑 LỜI ĐIỂM</button>
                                                <button onClick={() => handleArenaChoice('HOA')} className="btn-3d bg-amber-400 hover:bg-amber-500 text-amber-950 font-extrabold py-2 rounded-xl border-2 border-amber-600 text-sm sm:text-base">🤝 HÒA ĐIỂM</button>
                                                <button onClick={() => handleArenaChoice('LO')} className="btn-3d bg-rose-500 hover:bg-rose-600 text-white font-extrabold py-2 rounded-xl border-2 border-rose-700 text-sm sm:text-base">😭 LỖ ĐIỂM</button>
                                            </div>

                                            {arenaReveal && (
                                                <div className={`mt-2.5 rounded-xl p-2 border-2 font-extrabold text-xs sm:text-sm bounce-in ${arenaReveal.ok ? 'bg-emerald-100 border-emerald-500 text-emerald-900' : 'bg-rose-100 border-rose-500 text-rose-900'}`}>
                                                    <div>{arenaReveal.ok ? '✅ CHÍNH XÁC! ' : '❌ CHƯA ĐÚNG RỒI! '}{arenaReveal.text}</div>
                                                    {arenaReveal.ok && (
                                                        <div className="flex items-center justify-center gap-2 mt-1.5 pt-1.5 border-t border-emerald-300/80">
                                                            <span className="text-[11px] text-emerald-800">Thưởng nhanh cho đội trả lời đúng:</span>
                                                            <button onClick={() => { SoundFX.unlock(); setRedScore(redScore + 1); }} className="bg-rose-500 hover:bg-rose-600 text-white text-[11px] font-extrabold px-2.5 py-0.5 rounded-lg">+1 🐉 Rồng Đỏ</button>
                                                            <button onClick={() => { SoundFX.unlock(); setBlueScore(blueScore + 1); }} className="bg-sky-500 hover:bg-sky-600 text-white text-[11px] font-extrabold px-2.5 py-0.5 rounded-lg">+1 🦈 Cá Mập Xanh</button>
                                                        </div>
                                                    )}
                                                </div>
                                            )}

                                            <div className="mt-2.5 flex justify-center gap-3">
                                                <button onClick={() => { SoundFX.click(); setTimeLeft(15); setTimerRunning(true); }} className="btn-3d bg-indigo-500 hover:bg-indigo-600 text-white font-bold px-4 py-1.5 rounded-xl border-2 border-indigo-700 text-xs">
                                                    ⏱️ Chạy đồng hồ 15s
                                                </button>
                                                <button onClick={nextArenaQuestion} className="btn-3d bg-slate-700 hover:bg-slate-800 text-white font-bold px-4 py-1.5 rounded-xl border-2 border-slate-900 text-xs">
                                                    {arenaIdx + 1 === arenaQuestions.length ? '🏆 Tổng kết điểm' : 'Câu tiếp theo ➡️'}
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </section>
                            )}
                        </div>
                    </main>

                    {/* MODAL CHÚC MỪNG HOÀN THÀNH 100% BỨC TRANH BÍ ẨN */}
                    {showVictory && (
                        <div className="fixed inset-0 bg-slate-900/75 backdrop-blur-sm z-[90] flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-md w-full p-6 border-4 border-amber-400 shadow-2xl text-center bounce-in">
                                <div className="inline-block bg-amber-400 text-amber-950 font-black px-4 py-1 rounded-full text-xs uppercase mb-2">
                                    🎉 Chúc Mừng Siêu Nhí Cờ Vua! 🎉
                                </div>
                                <h2 className="text-2xl font-extrabold text-[#7c2d12]">Mở Khóa Tranh Thành Công!</h2>
                                <p className="text-slate-600 font-bold text-xs mt-1">Con đã giải đúng cả 23 thế cờ đổi quân có lợi thế!</p>

                                <div className="w-60 h-40 mx-auto my-4 rounded-2xl overflow-hidden shadow-xl border-4 border-amber-400">
                                    <svg viewBox="0 0 300 200" className="w-full h-full block">
                                        {ARTWORKS[artKey].renderSvgContent()}
                                    </svg>
                                </div>

                                <div className="bg-emerald-50 border-2 border-emerald-300 rounded-2xl p-2.5 mb-4">
                                    <div className="text-[11px] font-bold text-emerald-800 uppercase">Tổng thành tích đạt được</div>
                                    <div className="text-xl font-black text-emerald-600">+{totalProfit} Điểm Lời ⭐</div>
                                </div>

                                <div className="flex gap-2 justify-center">
                                    <button onClick={() => setShowVictory(false)} className="btn-3d bg-slate-200 text-slate-800 font-extrabold px-4 py-2 rounded-xl border-2 border-slate-400 text-xs">
                                        Xem lại bàn cờ
                                    </button>
                                    <button
                                        onClick={() => {
                                            setShowVictory(false);
                                            setArtKey(artKey === 'knightCup' ? 'crownCastle' : 'knightCup');
                                            setUnlockedTiles(Array(23).fill(false));
                                            setJustUnlocked(-1);
                                            loadPuzzle(0);
                                        }}
                                        className="btn-3d bg-emerald-600 text-white font-extrabold px-4 py-2 rounded-xl border-2 border-emerald-800 text-xs"
                                    >
                                        🎨 Đổi Tranh Mới & Chơi Lại
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
